# Legacy subdomain → main site paths.
# Landing: / → /ai , CRM: /crm → /ai/crm
server {
    listen 80;
    listen [::]:80;
    server_name ai.tmk-technohorizon.kz;

    location ^~ /crm {
        return 301 https://tmk-technohorizon.kz/ai$uri$is_args$args;
    }

    location ^~ /api/crm {
        return 301 https://tmk-technohorizon.kz$uri$is_args$args;
    }

    location / {
        return 301 https://tmk-technohorizon.kz/ai$request_uri;
    }
}
