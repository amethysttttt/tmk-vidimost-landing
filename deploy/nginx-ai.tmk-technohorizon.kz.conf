# Лендинг TMK на своём сервере (Казахстан), без обращений посетителей к Vercel.
# Страницы и файлы отдаёт nginx, форма заявок (/api/lead) проксируется на функцию Vercel
# с сервера - поэтому работает и у тех, у кого провайдер блокирует адреса Vercel.
# Положить в /etc/nginx/sites-available/, включить, получить сертификат: certbot --nginx -d ai.tmk-technohorizon.kz

server {
    listen 80;
    listen [::]:80;
    server_name ai.tmk-technohorizon.kz;

    root /var/www/ai.tmk-technohorizon.kz;
    index index.html;
    charset utf-8;

    # Служебные файлы репозитория не отдаём
    location ~ ^/(\.git|apps-script|tools|deploy)(/|$) { return 404; }
    location ~ ^/(README\.md|vercel\.json|\.vercelignore|\.gitignore)$ { return 404; }

    # Заголовки как на Vercel
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Красивые адреса без .html: /spasibo, /privacy и т.д.
    location / {
        if ($request_uri ~ ^/(.*)\.html(\?|$)) { return 301 /$1$is_args$args; }
        try_files $uri $uri.html $uri/ =404;
    }
    location = /index { return 301 /; }
    location = /thanks { return 301 /spasibo; }
    location = /spasibo {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /spasibo.html =404;
    }

    # Кэш для шрифтов и картинок
    location /assets/fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* \.(png|ico)$ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

    # Приём заявок: проксируем на функцию Vercel (секреты остаются в Vercel)
    location = /api/lead {
        proxy_pass https://tmk-vidimost.vercel.app/api/lead;
        proxy_ssl_server_name on;
        proxy_set_header Host tmk-vidimost.vercel.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 32k;
    }
    location /api/ { return 404; }

    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;
}
